; Settings of UCEngineBridge.dll, the part of DeusEdix's headless editor host that runs inside Deus Ex's engine
; (host/README.md). Read once when a host starts: edit this file (tools\mapkit\bin\UCEngineBridge.ini), then
; restart DeusEdix; an update of DeusEdix puts it back as shipped. A value left out keeps the default built into
; the bridge (the values below are those defaults).

[Navigation]
; UC_NAVDROP and UC_NAVDROP temp: how far below a navigation point the floor is looked for, in units
FloorSearch=512
; a point closer than this to where it would rest (the floor plus its collision height) is not moved
FloorTolerance=2
; UC_NAVDROP temp: a point higher than this over the floor was put there on purpose, and stays
MaxHeightOverFloor=64
; UC_NAVDROP temp: these classes, and their subclasses, stay where they are (one line each)
LeftAlone=PlayerStart
LeftAlone=Teleporter
LeftAlone=LiftCenter
LeftAlone=LiftExit
LeftAlone=InventorySpot
LeftAlone=WarpZoneMarker
LeftAlone=ButtonMarker
LeftAlone=TriggerMarker
; UC_KEEPPATHS restore: a route of the original map comes back only when both its points moved less than this
MovedTolerance=1

[WinDrvLite]
; LIGHT APPLY opens a temporary viewport, which Revision's WinDrvLite.dll refuses (UWindowsViewportLite::OpenWindow,
; check(!IsTemporary)). The bridge turns the je over that check into a jmp, in its own memory only, and only when
; the DLL holds exactly this Code at Offset (from the DLL's base). For another build of the DLL, write its offset
; and bytes here; with any other code, LIGHT APPLY is refused with Revision.
Offset=0x1647E
; cmp [ebp+0Ch], edi / je +18h / push 0E6h
Code=39 7D 0C 74 18 68 E6 00 00 00
; the je, counted from 0 in Code
Jump=3
