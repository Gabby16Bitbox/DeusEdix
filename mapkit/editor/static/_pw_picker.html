<!doctype html><meta charset="utf-8"><body style="background:#222;color:#ddd">
<input id="f" list="texlist" value="BrkWall_A">
<script type="module">
import { createTexturePicker } from './texture-picker.js';
const index = { packages: [
  { name: 'CoreTexWood', textures: [['Flr_Wd02','CoreTexWood.Floors.Flr_Wd02',256,256],['Flr_Wd03','CoreTexWood.Floors.Flr_Wd03',256,256],['woodpanel04','CoreTexWood.Walls.woodpanel04',128,128]] },
  { name: 'CoreTexMetal', textures: [['MtlPnl3','CoreTexMetal.Panels.MtlPnl3',128,128]] },
  { name: 'CoreTexBrick', textures: [['BrkWall_A','CoreTexBrick.Walls.BrkWall_A',256,256]] } ] };
const api = async (path) => path.startsWith('/api/texture_index') ? index : { thumbs: {} };
window.picks = [];
window.picker = createTexturePicker({ api, getMapTextures: () => [{ name: 'BrkWall_A', full: 'CoreTexBrick.Walls.BrkWall_A', url: '', size: '256×256' }],
  menu: () => {}, findInMap: null, storage: () => null, pickFromView: (done) => { window.picks.push(done); } });
window.picker.attach(document.getElementById('f'));
</script>
